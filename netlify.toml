[build]
  command = "pnpm build"
  # Surcharge le réglage UI hérité (`dist`, ère Vue). Next.js publie dans `.next` ;
  # le plugin @netlify/plugin-nextjs le transforme ensuite.
  publish = ".next"

[build.environment]
  NODE_VERSION = "18.19.1"

# Runtime Next.js officiel : gère le SSR, les routes API et la publication.
# (Remplace l'ancienne config Vue/Vite : publish=dist + redirect SPA /index.html.)
[[plugins]]
  package = "@netlify/plugin-nextjs"
